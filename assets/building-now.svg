<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Zoku Athletics, producto en construcción</title>
  <desc id="description">Mapa visual de un producto SportTech construido mediante aplicaciones móviles, web, backend, datos, experiencia de usuario y arquitectura.</desc>
  <defs>
    <linearGradient id="fade-x"><stop stop-color="white" stop-opacity="0"/><stop offset=".09" stop-color="white"/><stop offset=".91" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade-y" x2="0" y2="1"><stop stop-color="white" stop-opacity="0"/><stop offset=".2" stop-color="white"/><stop offset=".8" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="edges"><rect width="1200" height="300" fill="url(#fade-x)"/></mask>
    <mask id="vertical"><rect width="1200" height="300" fill="url(#fade-y)"/></mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#F3F0E9" fill-opacity="0.07"/></pattern>
  </defs>
  <style>
    .connection { stroke-dasharray: 12 10; animation: flow 7s linear infinite; }
    .core-ring { transform-box: fill-box; transform-origin: center; animation: breathe 3s cubic-bezier(.22,1,.36,1) infinite; }
    .node { animation: node 4s cubic-bezier(.22,1,.36,1) infinite; }
    .node:nth-of-type(2) { animation-delay: 1s; }
    .node:nth-of-type(3) { animation-delay: 2s; }
    .node:nth-of-type(4) { animation-delay: 3s; }
    @keyframes flow { to { stroke-dashoffset: -66; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .65; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes node { 0%, 75%, 100% { stroke: #A5A59F; } 18% { stroke: #B8E524; } }
    @media (prefers-reduced-motion: reduce) { .connection, .core-ring, .node { animation: none; } }
  </style>
  <!-- Fondo transparente y textura desvanecida para integrarse con el perfil. -->
  <g mask="url(#edges)"><g mask="url(#vertical)">
    <rect width="1200" height="300" fill="url(#dots)"/>
  </g></g>
  <g transform="translate(62 53)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text fill="#B8E524" font-size="13" font-weight="700" letter-spacing="2.4">BUILDING NOW / SPORTTECH</text>
    <text y="61" fill="#F3F0E9" font-size="42" font-weight="750" letter-spacing="-1">Zoku Athletics</text>
    <text y="100" fill="#A5A59F" font-size="18">SportTech · producto propio de BAZROX</text>
    <text y="144" fill="#F3F0E9" font-size="16">Deporte, entrenamiento, comunidad</text><text y="170" fill="#F3F0E9" font-size="16">y experiencia deportiva.</text>
  </g>
  <g transform="translate(835 150)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path class="connection" d="M0 0L-122-76M0 0L122-76M0 0L-122 76M0 0L122 76" stroke="#B8E524" stroke-opacity="0.5" stroke-width="2"/><path d="M-122-76H122L122 76H-122Z" fill="none" stroke="#292A26"/>
    <circle class="core-ring" r="54" fill="#B8E524" fill-opacity="0.1" stroke="#B8E524" stroke-width="2"/><circle r="11" fill="#B8E524"/>
    <text y="80" text-anchor="middle" fill="#B8E524" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCT</text>
    <g fill="#B8E524" fill-opacity=".04" stroke="#A5A59F" stroke-opacity=".65"><rect class="node" x="-178" y="-96" width="112" height="40" rx="20"/><rect class="node" x="66" y="-96" width="112" height="40" rx="20"/><rect class="node" x="-186" y="56" width="128" height="40" rx="20"/><rect class="node" x="66" y="56" width="112" height="40" rx="20"/></g>
    <g fill="#F3F0E9" font-size="12" font-weight="650" text-anchor="middle" letter-spacing="0.8"><text x="-122" y="-71">MOBILE</text><text x="122" y="-71">WEB</text><text x="-122" y="81">BACKEND</text><text x="122" y="81">DATA</text></g>
  </g>
  <path d="M534 53V247" stroke="#292A26"/><circle cx="534" cy="53" r="3" fill="#B8E524"/><circle cx="534" cy="247" r="3" fill="#B8E524"/>
</svg>
