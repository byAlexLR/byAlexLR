<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title description">
  <title id="title">BAZROX</title><desc id="description">We build the core. We design tomorrow.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B8E524" stop-opacity="0"/><stop offset="0.5" stop-color="#B8E524" stop-opacity="0.4"/><stop offset="1" stop-color="#B8E524" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade-x"><stop stop-color="white" stop-opacity="0"/><stop offset=".1" stop-color="white"/><stop offset=".9" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade-y" x2="0" y2="1"><stop stop-color="white"/><stop offset=".35" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="edges"><rect width="1200" height="130" fill="url(#fade-x)"/></mask>
    <mask id="bottom"><rect width="1200" height="130" fill="url(#fade-y)"/></mask>
  </defs>
  <style>
    .signal { stroke-dasharray: 22 16; animation: signal 8s linear infinite; }
    @keyframes signal { to { stroke-dashoffset: -76; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <!-- La onda se desvanece en los laterales y abajo para evitar el corte rectangular. -->
  <g mask="url(#edges)"><g mask="url(#bottom)">
    <path d="M0 40C208 3 380 94 594 47C790 4 970 85 1200 28V130H0Z" fill="url(#wave)"/><path class="signal" d="M0 40C208 3 380 94 594 47C790 4 970 85 1200 28" fill="none" stroke="#B8E524" stroke-opacity="0.72" stroke-width="2"/>
  </g></g>
  <text x="600" y="94" text-anchor="middle" fill="#F3F0E9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="3">WE BUILD THE CORE. WE DESIGN TOMORROW.</text>
</svg>
